spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tinyurl
    username: tinyurl
    password: tinyurl
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      connect-timeout: 500ms
  mvc:
    problemdetails:
      enabled: true
  tinyurl:
    app:
      base-url: http://localhost:8080

management:
  endpoints:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, workerLease, db, redis
        liveness:
          include: livenessState
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"