spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tinyurl
    username: tinyurl
    password: tinyurl
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always