server:
  tomcat:
    max-swallow-size: -1
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tinyurl
    username: tinyurl
    password: tinyurl
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      connect-timeout: 500ms
  mvc:
    problemdetails:
      enabled: true
  tinyurl:
    app:
      base-url: http://localhost:8080
  servlet:
    multipart:
      max-request-size: 100MB

management:
  endpoints:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, workerLease, db, redis
        liveness:
          include: livenessState
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
tinyurl:
  storage:
    endpoint: ${TINYURL_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${TINYURL_STORAGE_BUCKET:tinyurl-files}
    access-key: ${TINYURL_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${TINYURL_STORAGE_SECRET_KEY:minioadmin}
    upload-url-ttl: 15m
    download-url-ttl: 60s
    max-file-size-bytes: 104857600
  files:
    default-ttl: 24h
    max-ttl: 7d
    abandoned-after: 1h
    purge-grace: 1h
    sweep-interval: 60s