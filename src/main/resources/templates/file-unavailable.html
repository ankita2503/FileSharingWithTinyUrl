<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>File unavailable</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0;
               display: flex; min-height: 100vh; align-items: center; justify-content: center;
               background: #f6f7f9; color: #1a1a1a; }
        .card { background: #fff; border-radius: 12px; padding: 2rem; max-width: 26rem;
                width: calc(100% - 2rem); box-shadow: 0 1px 3px rgba(0,0,0,.12); text-align: center; }
        h1 { font-size: 1.1rem; margin: 0 0 .5rem; }
        p { color: #666; font-size: .875rem; margin: 0; }
    </style>
</head>
<body>
<div class="card">
    <h1>File unavailable</h1>
    <p th:text="${message}">This file is no longer available.</p>
</div>
</body>
</html>
